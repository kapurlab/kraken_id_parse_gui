# environment.bracken.yml
# Dedicated environment for Bracken.
#
# Why separate: on osx-64 the only Bracken 2.x builds link an old zlib (<1.3.0),
# which cannot coexist with the modern main env (numpy/WeasyPrint pull zlib 1.3.2).
# Bracken is isolated here; bin/kraken.py auto-detects envs/bracken/bin/bracken.
#
# Build once:
#   CONDA_SUBDIR=osx-64 mamba env create -f conda_setup/environment.bracken.yml
name: bracken
channels:
  - bioconda
  - conda-forge
dependencies:
  - bracken>=2.5,<3     # >=2.5 avoids an unrelated conda-forge 'bracken' 1.0.0
