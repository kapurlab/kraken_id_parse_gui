# environment.yml
name: kraken_id_parse_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  # --- core scientific stack (modernized for py3.11) ---
  - numpy>=1.24,<2          # <2 keeps scikit-allel happy
  - scikit-allel>=1.3.8     # allel.vcf_to_dataframe (reference_guided_assembly_vcf_to_fasta.py)
  - pandas>=2.0
  - matplotlib>=3.7
  - seaborn>=0.12
  - biopython>=1.81
  - pysam>=0.22
  # --- bioinformatics tools (unpinned: take the latest osx-64 builds) ---
  - blast>=2.12
  - bwa>=0.7
  - kraken2>=2.1
  - krakentools>=1.2
  # NOTE: Bracken 2.x (osx-64) links old zlib and cannot coexist with the modern
  # (zlib 1.3.2) stack in one env, so it lives in a separate 'bracken' env:
  #   conda_setup/environment.bracken.yml  (mamba env create -f that file)
  # The pipeline auto-finds envs/bracken/bin/bracken.
  - samtools>=1.13
  - spades>=3.15
  - vcflib
  - freebayes
  - picard
  - seqkit
  - krona
  - ncbi-datasets-cli       # datasets/dataformat: download NCBI Orbivirus genus for custom Kraken DB
  # --- report generation (HTML-first; PDF via WeasyPrint) ---
  - jinja2>=3.1             # HTML templating
  - weasyprint>=60          # HTML -> PDF (replaces the old LaTeX/pdflatex pipeline)
  - plotly>=5.20            # interactive coverage graphs in the HTML report
  - python-kaleido>=0.2     # static image export from plotly (optional)
  - cairosvg>=2.7           # SVG rasterization (logo/banner handling)
  # --- utilities ---
  - openpyxl                # Excel_Stats output
  - humanize
  - parallel
  - pigz
  - pytest>=7
  - pip
  - tk                      # tkinter support
